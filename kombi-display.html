<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Bauch &amp; Flamme – Kombi-Anzeige</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1F2A24; }
  .flaeche { display: flex; width: 100vw; height: 100vh; }
  /* Linke Hälfte: Bon-Display (Team, Hütte) */
  .haelfte { width: 50%; height: 100%; border: 0; }
  /* Rechte Hälfte: Video (Gäste, draußen) */
  .video-seite { width: 50%; height: 100%; background: #000; display: flex; align-items: center; justify-content: center; }
  .video-seite video { width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
  <div class="flaeche">
    <iframe class="haelfte" src="bon-display.html" title="Bestellungen"></iframe>
    <div class="video-seite">
      <video id="v" autoplay loop muted playsinline>
        <source src="video.mp4" type="video/mp4">
      </video>
    </div>
  </div>
<script>
  // Sicherheitsnetz: Video neu starten, falls die Wiedergabe je stoppt
  const v = document.getElementById("v");
  v.play().catch(() => {});
  setInterval(() => { if (v.paused) v.play().catch(() => {}); }, 5000);
</script>
</body>
</html>
