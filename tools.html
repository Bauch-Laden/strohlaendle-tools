<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tools – Strohländle 2026</title>
<style>
  :root {
    --orange: #FF9A00;
    --flame: #FF6700;
    --dark: #2B2620;
    --cream: #FBF7F0;
    --line: #E8E0D3;
    --text: #3A342C;
    --muted: #766F63;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--cream);
    color: var(--text);
    line-height: 1.5;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 48px 24px 100px; text-align: center; }
  .back-link { display: block; text-align: left; color: var(--flame); text-decoration: none; font-weight: 600; margin-bottom: 16px; }
  .eyebrow { color: var(--flame); font-weight: 700; letter-spacing: 0.08em; font-size: 0.8rem; text-transform: uppercase; }
  h1 { font-size: 1.9rem; margin: 8px 0 8px; color: var(--dark); }
  .subtitle { color: var(--muted); margin-bottom: 40px; }

  .tile {
    display: flex; align-items: center; gap: 16px;
    background: #fff; border: 1px solid var(--line); border-radius: 14px;
    padding: 22px 24px; margin-bottom: 16px; text-decoration: none; color: inherit;
    text-align: left; transition: border-color 0.15s, transform 0.15s;
  }
  .tile:hover { border-color: var(--orange); transform: translateY(-2px); }
  .tile-icon { font-size: 2rem; flex-shrink: 0; }
  .tile-text { flex: 1; }
  .tile-title { font-weight: 700; font-size: 1.15rem; color: var(--dark); }
  .tile-sub { font-size: 0.88rem; color: var(--muted); margin-top: 2px; }
  .tile-arrow { color: var(--orange); font-size: 1.4rem; flex-shrink: 0; }

  footer { margin-top: 40px; font-size: 0.8rem; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="index.html">← Zur Startseite</a>
  <div class="eyebrow">Bauch-Laden · Bauch & Flamme</div>
  <h1>🛠️ Tools</h1>
  <p class="subtitle">Digitale Helfer für den Arbeitsalltag</p>

  <a class="tile" href="arbeitszeit.html">
    <div class="tile-icon">⏱️</div>
    <div class="tile-text">
      <div class="tile-title">Arbeitszeit erfassen</div>
      <div class="tile-sub">Täglich nach der Schicht, mit Freigabe-Code</div>
    </div>
    <div class="tile-arrow">→</div>
  </a>

  <a class="tile" href="bf-bedienung-hilfe.html">
    <div class="tile-icon">🖥️</div>
    <div class="tile-text">
      <div class="tile-title">Bedienung Hilfe</div>
      <div class="tile-sub">Bauch & Flamme Kassen-Zählhilfe</div>
    </div>
    <div class="tile-arrow">→</div>
  </a>

  <footer>Bauch-Laden Food-Truck & Bauch & Flamme</footer>
</div>
</body>
</html>
