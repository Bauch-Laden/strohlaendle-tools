<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bauch &amp; Flamme – Bestellungen</title>
<style>
  :root {
    --bg: #1F2A24;
    --panel: #26332C;
    --panel-border: #35463C;
    --chalk: #F5F1E6;
    --chalk-muted: #A9B3A6;
    --mustard: #E8A33D;
    --sage: #7FA875;
    --weinrot: #8E2230;
    --weinrot-hell: #E05C6E;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--chalk);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex; flex-direction: column;
    padding: 2vh 2.5vw;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .hint { font-size: 2vh; color: #FFFFFF; opacity: 0.9; }
  .version { font-size: 1.7vh; color: #FFFFFF; opacity: 0.5; font-weight: 400; letter-spacing: 0; margin-left: 0.6vw; }
  .waiting { font-size: 4.6vh; font-weight: 800; color: #FFFFFF;
             background: var(--weinrot); border: 2px solid var(--weinrot-hell);
             border-radius: 1.4vh; padding: 0.9vh 2.4vw; white-space: nowrap; margin-top: 1.4vh; }
  .hidden { display: none !important; }
  .footer-btn {
    font-family: inherit; font-size: 2vh; font-weight: 700;
    color: #FFFFFF; background: rgba(245,241,230,0.10);
    border: 1px solid var(--panel-border); border-radius: 1vh;
    padding: 0.7vh 1.1vw; cursor: pointer; transition: background 0.15s, color 0.15s;
  }
  .footer-btn:hover { background: rgba(245,241,230,0.15); color: var(--chalk); }
  .footer-btn:active { transform: scale(0.96); }
  .footer-btn.flash { background: rgba(127,168,117,0.3); color: var(--chalk); }
  .footer-btns { display: flex; gap: 0.9vw; align-items: center; }
  .all-btn { border-color: rgba(127,168,117,0.5); }
  .all-btn:hover { background: rgba(127,168,117,0.2); }
  .verbrauch-btn { border-color: rgba(232,163,61,0.5); }
  .verbrauch-btn:hover { background: rgba(232,163,61,0.18); }

  header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; flex-shrink: 0; margin-bottom: 1.5vh; gap: 1vw; }
  header .status { justify-self: end; }
  .mitte { justify-self: center; display: flex; flex-direction: column; align-items: center; gap: 0.8vh; align-self: start; }
  .datetime { font-size: 2.4vh; color: #FFFFFF; white-space: nowrap; }

  footer { flex-shrink: 0; margin-top: 1.2vh; padding-top: 1.1vh; border-top: 1px solid var(--panel-border); }
  .footer-row { display: flex; align-items: center; justify-content: space-between; gap: 1vw; }
  h1 { font-size: 3vh; letter-spacing: 0.06em; text-transform: uppercase; color: #FFFFFF; font-weight: 700; line-height: 1.1; }
  .status { font-size: 2.1vh; color: #FFFFFF; display: flex; align-items: center; gap: 0.8vw; white-space: nowrap; }
  .conn { display: flex; align-items: center; gap: 0.5vw; font-size: 1.7vh; white-space: nowrap; }
  .dot { width: 1.3vh; height: 1.3vh; border-radius: 50%; background: var(--sage); flex-shrink: 0; }
  .dot.offline { background: #B5573F; }
  .conn.online #connText { color: var(--sage); }
  .conn.offline #connText { color: #D98169; font-weight: 700; }

  /* ===== Verbrauchsübersicht (Fußzeile, auf-/zuklappbar) ===== */
  .verbrauch-panel {
    margin-top: 1vh; padding: 1.1vh 1.2vw; background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 1.2vh; font-size: 1.9vh; line-height: 1.55; color: #FFFFFF;
  }
  .verbrauch-panel .zeile1 { margin-bottom: 0.3vh; }
  .verbrauch-panel .broetchen { color: var(--mustard); font-weight: 700; }
  .verbrauch-leer { color: var(--chalk-muted); font-style: italic; }

  /* ===== Bon-Liste: echtes horizontales Scrollen ===== */
  .list {
    flex: 1; min-height: 0; position: relative;
    display: flex; overflow-x: auto; overflow-y: hidden;
    gap: 1.2vw; padding: 0 0.2vw;
    scroll-behavior: smooth;
  }
  .list::-webkit-scrollbar { height: 0.8vh; }
  .list::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 1vh; }

  /* Jede Karte exakt 1/5 der Breite -> 5 passen ins Bild, mehr liegen im Scrollbereich */
  .bon {
    flex: 0 0 calc((100% - 4 * 1.2vw) / 5);
    display: flex; flex-direction: column; align-items: stretch;
    gap: 1vh; cursor: pointer;
  }
  .bon.row-enter { animation: fadeIn 0.35s ease-out; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .pos-nr {
    text-align: center; font-size: 4.6vh; font-weight: 800; line-height: 1;
    color: #FFFFFF; opacity: 0.9; letter-spacing: -0.02em; flex-shrink: 0;
  }
  .bon.done .pos-nr { color: var(--sage); opacity: 0.8; }

  .bon-card {
    background: var(--panel); border: 2px solid var(--panel-border); border-radius: 1.6vh;
    padding: 1.8vh 1.1vw; display: flex; flex-direction: column; gap: 1vh;
    min-height: 40vh; overflow: hidden; position: relative;
  }
  .bon:active .bon-card { filter: brightness(1.2); }
  .bon.done .bon-card { opacity: 0.4; border-color: var(--sage); background: var(--panel); }
  .bon.expanded .bon-card { border-color: var(--mustard); background: linear-gradient(180deg, rgba(232,163,61,0.08), var(--panel)); }

  /* Test-Bon aus dem Testmodus der Kasse: deutlich als "TEST" markiert, zählt nirgends mit */
  .bon.test .bon-card { border-color: #C34DDB; border-width: 3px; }
  .bon.test .bon-card::before {
    content: "TEST"; position: absolute; top: 0.6vh; left: 50%; transform: translateX(-50%) rotate(-4deg);
    background: #C34DDB; color: #fff; font-weight: 800; font-size: 1.7vh; letter-spacing: 0.1em;
    padding: 0.3vh 1.4vw; border-radius: 0.6vh; z-index: 2; box-shadow: 0 2px 6px rgba(0,0,0,0.35);
  }

  .done-badge {
    position: absolute; top: 1vh; right: 1vw;
    font-size: 3.6vh; color: var(--sage); line-height: 1; display: none;
  }
  .bon.done .done-badge { display: block; }

  .bon-time { font-size: 2.2vh; color: #FFFFFF; font-weight: 700; flex-shrink: 0; letter-spacing: 0.04em; }
  .bon-items { display: flex; flex-direction: column; gap: 0.7vh; min-height: 0; overflow: hidden; flex: 1; }

  .bon-item { font-size: 2.9vh; font-weight: 700; line-height: 1.15; overflow-wrap: break-word; }
  .bon.done .bon-item { text-decoration: line-through; }
  .bon-qty { color: var(--mustard); margin-right: 0.4vw; }
  .bon.done .bon-qty { color: #FFFFFF; }

  /* Einzelpositions-Zeilen im aufgeklappten Modus */
  .item-line { display: flex; align-items: center; gap: 0.5vw; padding: 0.5vh 0.4vw; border-radius: 0.8vh; }
  .item-line.tappable { background: rgba(245,241,230,0.06); }
  .item-line.tappable:active { background: rgba(232,163,61,0.25); }
  .item-line.given { opacity: 0.45; }
  .item-line.given .bon-item { text-decoration: line-through; }
  .item-hint { font-size: 1.5vh; color: var(--chalk-muted); margin-top: 0.3vh; }

  .close-expand {
    align-self: center; margin-top: auto; font-size: 1.8vh; color: var(--chalk-muted);
    background: rgba(245,241,230,0.08); border: 1px solid var(--panel-border);
    border-radius: 0.8vh; padding: 0.5vh 1.5vw;
  }

  .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 3.5vh; color: #FFFFFF; opacity: 0.85; text-align: center; }
</style>
</head>
<body>
  <header>
    <h1>🔥 B&amp;F Bestellmanagement <span class="version" id="version"></span></h1>
    <div class="mitte">
      <div class="datetime" id="datetime"></div>
      <div class="waiting hidden" id="waiting"></div>
    </div>
    <div class="status">
      <span class="conn" id="conn"><span class="dot" id="dot"></span><span id="connText"></span></span>
    </div>
  </header>

  <div class="list" id="list">
    <div class="empty">Warte auf die erste Bestellung…</div>
  </div>

  <footer>
    <div class="footer-row">
      <span class="hint">Taste <b>1–5</b> = ausgegeben &nbsp;·&nbsp; <b>0</b> = zurück &nbsp;·&nbsp; lang drücken = Positionen einzeln</span>
      <div class="footer-btns">
        <button class="footer-btn verbrauch-btn" id="verbrauchToggleBtn">📋 Verbrauch</button>
        <button class="footer-btn" id="undoBtn" title="Zuletzt ausgegebene Bestellung zurückholen">&#10226; Undo</button>
        <button class="footer-btn all-btn" id="doneAllBtn" title="Alle offenen Bestellungen als ausgegeben markieren">&#10003;&#10003; Alle ausgegeben</button>
      </div>
    </div>
    <div class="verbrauch-panel" id="verbrauchPanel">
      <div class="verbrauch-leer">Lade Verbrauchsdaten…</div>
    </div>
  </footer>

<script>
  const DISPLAY_VERSION = "2.8.0";   // bei jeder Änderung an dieser Datei erhöhen
  const POLL_MS = 800;
  const VERBRAUCH_POLL_MS = 30000;   // Verbrauchsübersicht seltener aktualisieren
  const LONGPRESS_MS = 550;
  let failCount = 0;
  let currentBons = [];

  function tick() {
    const now = new Date();
    const datum = now.toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit", year: "numeric" });
    const zeit = now.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
    document.getElementById("datetime").textContent = datum + " · " + zeit + " Uhr";
  }
  tick();
  setInterval(tick, 5000);
  document.getElementById("version").textContent = "v" + DISPLAY_VERSION;

  // Kurznamen nur für die Anzeige – in Kasse, Verlauf und CSV bleiben die vollen Namen
  const KURZNAMEN = {
    "Hähnchenbrustfilet": "Hähnchen-Brust",
    "Weißwurst mit Brezel": "Weißwurst",
    "Schweinenackensteak": "Schweinsteak",
    "Thüringer Bratwurst": "Thüringer",
    "Männergedeck mit Chip": "Männergedeck",
    "Kinder Hotdog": "Kinder-Hotdog",
    "Currywurst mit Pommes": "Curry+Pommes",
  };
  function kurz(name) { return KURZNAMEN[name] || name; }

  function setVerbindung(ok) {
    const conn = document.getElementById("conn");
    const dot = document.getElementById("dot");
    const text = document.getElementById("connText");
    dot.classList.toggle("offline", !ok);
    conn.classList.toggle("online", ok);
    conn.classList.toggle("offline", !ok);
    text.textContent = ok ? "Verbunden – Bestellungen kommen an" : "Keine Verbindung – Kasse prüfen!";
  }
  setVerbindung(true);

  // ============================================================
  //  Bon-Liste: echtes horizontales Scrollen
  // ============================================================

  // Karten, die gerade in der Einzelpositions-Ansicht aufgeklappt sind (nur lokale UI, nicht synchronisiert)
  const expandedIds = new Set();

  function isDone(b) { return b.done || pendingDone.has(b.id); }

  function itemsDoneFuer(b) {
    if (pendingDone.has(b.id)) return b.items.map((it) => it.qty);   // lokal schon als komplett markiert
    return b.itemsDone || b.items.map(() => 0);
  }

  function render(allBons) {
    const list = document.getElementById("list");
    const waitingEl = document.getElementById("waiting");

    // Merken, ob die Ansicht GERADE JETZT (vor dieser Aktualisierung) am rechten Standardplatz war.
    // Nur dann wird nach dem Update automatisch wieder dorthin gestellt — wer gerade aktiv zu
    // älteren/neueren Bestellungen gescrollt hat, wird dabei bewusst nicht unterbrochen.
    const warAmStandardplatz = Math.abs(list.scrollLeft - (list.scrollWidth - list.clientWidth)) < 4;

    // Chronologisch aufsteigend nur für die NUMMERIERUNG (älteste = Nr. 1, bleibt stabil).
    const sorted = (allBons || []).slice().sort((a, b) => new Date(a.ts) - new Date(b.ts));
    const nrById = new Map(sorted.map((b, idx) => [b.id, idx + 1]));

    const offen = sorted.filter((b) => !isDone(b)).length;
    const ueberschuss = Math.max(0, offen - 5);
    if (ueberschuss > 0) {
      waitingEl.textContent = "+" + ueberschuss + " noch in der Schlange";
      waitingEl.classList.remove("hidden");
    } else {
      waitingEl.classList.add("hidden");
    }

    const emptyEl = list.querySelector(".empty");
    if (sorted.length === 0) {
      list.querySelectorAll(".bon").forEach((el) => el.remove());
      if (!emptyEl) list.innerHTML = '<div class="empty">Warte auf die erste Bestellung…</div>';
      return;
    }
    if (emptyEl) emptyEl.remove();

    const wanted = new Set(sorted.map((b) => b.id));
    list.querySelectorAll(".bon").forEach((el) => {
      const id = el.getAttribute("data-id");
      if (!wanted.has(id)) { el.remove(); expandedIds.delete(id); }
    });

    // Für die BILDSCHIRM-Reihenfolge (links → rechts) absteigend: neueste links, älteste (Nr. 1) rechts.
    const anzeigeReihenfolge = sorted.slice().reverse();

    anzeigeReihenfolge.forEach((b, idx) => {
      const done = isDone(b);
      const expanded = expandedIds.has(b.id);
      const nr = nrById.get(b.id);
      let el = list.querySelector('.bon[data-id="' + cssEscape(b.id) + '"]');

      if (!el) {
        el = document.createElement("div");
        el.className = "bon row-enter";
        el.setAttribute("data-id", b.id);
        el.innerHTML = '<div class="pos-nr"></div><div class="bon-card"><div class="done-badge">&check;</div><div class="bon-time"></div><div class="bon-items"></div></div>';
        list.appendChild(el);
        el.addEventListener("animationend", () => el.classList.remove("row-enter"), { once: true });
        attachCardEvents(el);
      }

      // Reihenfolge im DOM = neueste links … älteste rechts (für den Scroll-Effekt); nur bei Bedarf umsortieren
      if (list.children[idx] !== el) list.insertBefore(el, list.children[idx] || null);

      // Nur die erste Karte bekommt den Auto-Rand: Bei wenigen Bestellungen rutscht die ganze
      // Reihe dadurch rechtsbündig; bei Überlauf zieht der Browser den Rand automatisch auf 0
      // zusammen — anders als bei justify-content:flex-end bleibt der Inhalt dadurch normal
      // per Wischen/Scrollen erreichbar.
      el.style.marginLeft = idx === 0 ? "auto" : "";

      el.classList.toggle("done", done);
      el.classList.toggle("expanded", expanded);
      el.classList.toggle("test", !!b.isTest);
      el.dataset.nr = nr;

      const nrEl = el.querySelector(".pos-nr");
      if (nrEl.textContent !== String(nr)) nrEl.textContent = String(nr);

      const time = new Date(b.ts).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
      const timeEl = el.querySelector(".bon-time");
      if (timeEl.textContent !== time) timeEl.textContent = time;

      renderItems(el.querySelector(".bon-items"), b, expanded, done);
    });

    // Beim allerersten Füllen der Liste direkt rechtsbündig zeigen (älteste 5 sichtbar)
    if (!list.dataset.initialised) {
      list.dataset.initialised = "1";
      requestAnimationFrame(() => scrollZurRechten(false));
    } else if (warAmStandardplatz) {
      // War die Ansicht am Standardplatz und ist gerade z. B. eine neue Bestellung dazugekommen:
      // sofort wieder an den (neuen) rechten Rand nachziehen, statt "1 bis 5" zu "2 bis 6" abdriften
      // zu lassen. Ohne Animation, damit es nicht wie ein extra Wisch-Effekt aussieht.
      requestAnimationFrame(() => scrollZurRechten(false));
    }
  }

  function scrollZurRechten(smooth) {
    const list = document.getElementById("list");
    list.scrollTo({ left: list.scrollWidth - list.clientWidth, behavior: smooth ? "smooth" : "auto" });
  }

  function renderItems(container, b, expanded, done) {
    const doneQtys = itemsDoneFuer(b);

    if (!expanded) {
      // Kompakte Ansicht: zeigt Teilfortschritt ("2× gegeben" durchgestrichen, "1× offen" normal),
      // aber rein informativ – nicht antippbar. So sieht JEDER Bildschirm sofort, was schon
      // ausgegeben wurde, auch ohne dort selbst lang gedrückt zu haben.
      let html = "";
      b.items.forEach((it, idx) => {
        const gegeben = doneQtys[idx] || 0;
        const offen = it.qty - gegeben;
        if (gegeben > 0) {
          html += '<div class="item-line given"><span class="bon-item"><span class="bon-qty">' + gegeben + '&times;</span>' + escapeHtml(kurz(it.name)) + '</span></div>';
        }
        if (offen > 0) {
          html += '<div class="item-line"><span class="bon-item"><span class="bon-qty">' + offen + '&times;</span>' + escapeHtml(kurz(it.name)) + '</span></div>';
        }
      });
      container.innerHTML = html;
      return;
    }

    // Aufgeklappte Ansicht: jede Position einzeln antippbar, gleiche Aufteilung + Bedienhinweise
    let html = "";
    b.items.forEach((it, idx) => {
      const gegeben = doneQtys[idx] || 0;
      const offen = it.qty - gegeben;
      if (gegeben > 0) {
        html += '<div class="item-line given tappable" data-idx="' + idx + '" data-richtung="zurueck">' +
                  '<span class="bon-item"><span class="bon-qty">' + gegeben + '&times;</span>' + escapeHtml(kurz(it.name)) + '</span>' +
                '</div>';
      }
      if (offen > 0) {
        html += '<div class="item-line tappable" data-idx="' + idx + '" data-richtung="vor">' +
                  '<span class="bon-item"><span class="bon-qty">' + offen + '&times;</span>' + escapeHtml(kurz(it.name)) + '</span>' +
                '</div>';
      }
    });
    html += '<div class="item-hint">Antippen: offen → gegeben. Nochmal antippen: zurück.</div>';
    html += '<div class="close-expand" data-schliessen="1">▲ zuklappen</div>';
    container.innerHTML = html;
  }

  function cssEscape(s) { return String(s).replace(/["\\]/g, "\\$&"); }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // ============================================================
  //  Abhaken (ganzer Bon / einzelne Position)
  // ============================================================

  const pendingDone = new Set();

  function markDone(id) {
    if (!id || pendingDone.has(id)) return;
    pendingDone.add(id);
    expandedIds.delete(id);
    render(currentBons);
    fetch("/api/bon/done", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: id }),
    }).then(() => setTimeout(poll, 450))
      .catch(() => { pendingDone.delete(id); render(currentBons); });
  }

  function setItemQty(id, index, doneQty) {
    fetch("/api/bon/item", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: id, index: index, doneQty: doneQty }),
    }).then((r) => r.json()).then((data) => {
      if (data && data.ok && data.bon) {
        const i = currentBons.findIndex((b) => b.id === id);
        if (i >= 0) currentBons[i] = data.bon;
        render(currentBons);
        if (data.bon.done) setTimeout(poll, 450);
      }
    }).catch(() => {});
  }

  // ============================================================
  //  Antippen vs. lang drücken pro Karte
  // ============================================================

  function attachCardEvents(el) {
    let timer = null;
    let longPressed = false;
    let startX = 0, startY = 0;

    function start(x, y) {
      longPressed = false;
      startX = x; startY = y;
      timer = setTimeout(() => {
        longPressed = true;
        const id = el.getAttribute("data-id");
        if (expandedIds.has(id)) expandedIds.delete(id); else expandedIds.add(id);
        render(currentBons);
      }, LONGPRESS_MS);
    }
    function cancel() { if (timer) { clearTimeout(timer); timer = null; } }

    el.addEventListener("pointerdown", (e) => start(e.clientX, e.clientY));
    el.addEventListener("pointermove", (e) => {
      if (timer && (Math.abs(e.clientX - startX) > 12 || Math.abs(e.clientY - startY) > 12)) cancel();
    });
    el.addEventListener("pointerup", (e) => {
      cancel();
      if (longPressed) return;   // langer Druck hat bereits gehandelt

      const itemLine = e.target.closest(".item-line.tappable");
      const schliessen = e.target.closest("[data-schliessen]");
      const id = el.getAttribute("data-id");

      if (schliessen) {
        expandedIds.delete(id);
        render(currentBons);
        return;
      }
      if (itemLine) {
        const idx = parseInt(itemLine.getAttribute("data-idx"), 10);
        const bon = currentBons.find((b) => b.id === id);
        if (!bon) return;
        const doneQtys = itemsDoneFuer(bon);
        const richtung = itemLine.getAttribute("data-richtung");
        const aktuell = doneQtys[idx] || 0;
        const neu = richtung === "vor" ? aktuell + 1 : Math.max(0, aktuell - 1);
        setItemQty(id, idx, neu);
        return;
      }
      // Tap auf die Karte außerhalb der Item-Zeilen: nur im nicht-aufgeklappten Zustand -> ganzer Bon fertig
      if (!expandedIds.has(id)) markDone(id);
    });
    el.addEventListener("pointercancel", cancel);
  }

  // ============================================================
  //  Auto-Rücksprung zu den ältesten 5 nach 10 Sek. ohne Scrollen
  // ============================================================
  let scrollIdleTimer = null;
  document.getElementById("list").addEventListener("scroll", () => {
    clearTimeout(scrollIdleTimer);
    scrollIdleTimer = setTimeout(() => scrollZurRechten(true), 10000);
  });

  // ============================================================
  //  Undo / Alle ausgegeben
  // ============================================================
  function undo() {
    fetch("/api/undo", { method: "POST" }).then((r) => r.json()).then((data) => {
      if (data && data.ok) {
        pendingDone.clear();
        const btn = document.getElementById("undoBtn");
        btn.classList.add("flash");
        setTimeout(() => btn.classList.remove("flash"), 400);
        poll();
      }
    }).catch(() => {});
  }
  document.getElementById("undoBtn").addEventListener("click", undo);

  document.getElementById("doneAllBtn").addEventListener("click", () => {
    const offen = currentBons.filter((b) => !isDone(b)).length;
    if (offen === 0) return;
    if (!window.confirm(offen + " offene Bestellung" + (offen === 1 ? "" : "en") + " wirklich alle als ausgegeben markieren?")) return;
    fetch("/api/done-all", { method: "POST" }).then((r) => r.json()).then(() => { pendingDone.clear(); expandedIds.clear(); poll(); }).catch(() => {});
  });

  // Tastatur / Nummernblock: 1–5 = jeweilige Karte (chronologischer Rang) komplett abhaken
  document.addEventListener("keydown", (e) => {
    if (e.key === "0" || e.key.toLowerCase() === "u") { undo(); return; }
    const n = parseInt(e.key, 10);
    if (!Number.isFinite(n) || n < 1 || n > 5) return;
    const card = document.querySelector('#list .bon[data-nr="' + n + '"]');
    if (card) markDone(card.getAttribute("data-id"));
  });

  // ============================================================
  //  Verbrauchsübersicht (Team-Ansicht: nur Stückzahlen, kein Umsatz)
  // ============================================================

  const BROETCHEN = ["thueringer", "schweinenacken", "haehnchenbrust", "rotewurst", "currywurst", "feuerwurst"];
  const BREZELN = ["weisswurstbrezel", "maennergedeck"];
  const PRODUKT_NAMEN = {
    pommes: "Pommes", wedges: "Wedges", currywurst: "Currywurst",
    currywurstpommes: "Curry+Pommes", rotewurst: "Rote Wurst", kinderhotdog: "Kinder Hotdog",
    feuerwurst: "Feuerwurst", thueringer: "Thüringer", schweinenacken: "Schweinsteak",
    haehnchenbrust: "Hähnchen-Brust", weisswurstbrezel: "Weißwurst", maennergedeck: "Männergedeck",
  };

  let verbrauchOffen = false;   // startet eingeklappt

  function verbrauchAnzeigen(sichtbar) {
    document.getElementById("verbrauchPanel").classList.toggle("hidden", !sichtbar);
  }
  verbrauchAnzeigen(false);

  document.getElementById("verbrauchToggleBtn").addEventListener("click", () => {
    verbrauchOffen = !verbrauchOffen;
    verbrauchAnzeigen(verbrauchOffen);
  });

  // Wichtig: LOKALES Datum berechnen, genau wie todayKey() in der Kasse — toISOString() würde
  // stattdessen die UTC-Zeit liefern, was zwischen Mitternacht und 2 Uhr (Sommerzeit) zum
  // falschen Vortag führen und die Verbrauchsübersicht "leer" erscheinen lassen würde.
  function heutigesDatum() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }

  function verbrauchLaden() {
    fetch("/api/backup?t=" + Date.now(), { cache: "no-store" })
      .then((r) => r.json())
      .then((a) => {
        const panel = document.getElementById("verbrauchPanel");
        if (!a.ok) { panel.innerHTML = '<div class="verbrauch-leer">Noch keine Daten für heute.</div>'; return; }
        const heute = heutigesDatum();
        const tag = (a.daten.history || {})[heute];
        if (!tag) { panel.innerHTML = '<div class="verbrauch-leer">Noch keine Verkäufe heute erfasst.</div>'; return; }
        const produkte = tag.products || {};
        const teile = Object.keys(PRODUKT_NAMEN)
          .filter((id) => produkte[id] > 0)
          .map((id) => PRODUKT_NAMEN[id] + " " + produkte[id] + "×");
        const broetchen = BROETCHEN.reduce((s, id) => s + (produkte[id] || 0), 0);
        const brezeln = BREZELN.reduce((s, id) => s + (produkte[id] || 0), 0);
        if (teile.length === 0) {
          panel.innerHTML = '<div class="verbrauch-leer">Noch keine Verkäufe heute erfasst.</div>';
          return;
        }
        panel.innerHTML = '<div class="zeile1">' + teile.join(" · ") + '</div>' +
                           '<div class="broetchen">🥖 Brötchen insgesamt: ' + broetchen + ' Stück' +
                           ' &nbsp;·&nbsp; 🥨 Brezeln insgesamt: ' + brezeln + ' Stück</div>';
      })
      .catch(() => {
        document.getElementById("verbrauchPanel").innerHTML = '<div class="verbrauch-leer">Verbrauchsdaten nicht erreichbar.</div>';
      });
  }
  verbrauchLaden();
  setInterval(verbrauchLaden, VERBRAUCH_POLL_MS);

  // ============================================================
  //  Server abfragen
  // ============================================================
  async function poll() {
    try {
      const res = await fetch("/api/bons", { cache: "no-store" });
      const data = await res.json();
      failCount = 0;
      setVerbindung(true);
      currentBons = data.bons;
      const serverIds = new Set(currentBons.map((b) => b.id));
      pendingDone.forEach((id) => { if (!serverIds.has(id)) pendingDone.delete(id); });
      render(currentBons);
    } catch (e) {
      failCount++;
      if (failCount > 2) setVerbindung(false);
    }
  }

  poll();
  setInterval(poll, POLL_MS);
</script>
</body>
</html>
