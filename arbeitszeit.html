<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arbeitszeit – Strohländle 2026</title>
<style>
  :root {
    --orange: #FF9A00;
    --flame: #FF6700;
    --dark: #2B2620;
    --cream: #FBF7F0;
    --line: #E8E0D3;
    --text: #3A342C;
    --muted: #766F63;
    --green: #3C8A5B;
    --red: #C42829;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--cream);
    color: var(--text);
    line-height: 1.5;
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 24px 20px 100px; }
  .back-link { display: inline-block; color: var(--flame); text-decoration: none; font-weight: 600; margin-bottom: 12px; }
  .eyebrow { color: var(--flame); font-weight: 700; letter-spacing: 0.08em; font-size: 0.75rem; text-transform: uppercase; }
  h1 { font-size: 1.6rem; margin: 6px 0 18px; color: var(--dark); }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-weight: 700; font-size: 0.9rem; margin-bottom: 6px; color: var(--dark); }
  .field input, .field select {
    width: 100%; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 10px;
    font-size: 1rem; background: #fff; color: var(--text); font-family: inherit;
  }
  .field input:focus, .field select:focus { outline: none; border-color: var(--orange); }

  .team-row { display: flex; gap: 10px; }
  .team-btn {
    flex: 1; padding: 14px 0; border-radius: 10px; border: 2px solid var(--line);
    background: #fff; font-size: 1rem; font-weight: 700; cursor: pointer; font-family: inherit; color: var(--muted);
  }
  .team-btn.bl.selected { border-color: #FF9A00; color: #FF9A00; background: #FFF6E8; }
  .team-btn.bf.selected { border-color: #C42829; color: #C42829; background: #FBEDED; }

  .time-row { display: flex; gap: 10px; }
  .time-row .field { flex: 1; margin-bottom: 0; }

  .summary {
    background: #fff; border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; margin: 18px 0; font-size: 0.95rem;
  }
  .summary-row { display: flex; justify-content: space-between; padding: 3px 0; }
  .summary-label { color: var(--muted); }
  .summary-value { font-weight: 700; color: var(--dark); }
  .summary-note { color: var(--muted); font-size: 0.8rem; margin-top: 6px; }

  .error-box {
    background: #FBEDED; border: 1px solid var(--red); color: var(--red);
    border-radius: 10px; padding: 10px 14px; font-size: 0.9rem; margin-bottom: 14px; display: none;
  }
  .error-box.visible { display: block; }

  .btn {
    display: block; width: 100%; background: var(--orange); color: #fff; border: none;
    padding: 15px 0; border-radius: 10px; font-size: 1.05rem; font-weight: 700;
    cursor: pointer; font-family: inherit;
  }
  .btn:hover { background: var(--flame); }
  .btn:disabled { opacity: 0.45; cursor: default; }

  .success-card {
    text-align: center; background: #fff; border: 1px solid var(--line);
    border-radius: 14px; padding: 36px 24px;
  }
  .success-icon { font-size: 3rem; margin-bottom: 10px; }
  .hidden { display: none !important; }
</style>
</head>

<div class="wrap">

  <div id="form-area">
    <div class="field">
      <label for="f-datum">Datum</label>
      <input type="date" id="f-datum" min="2026-08-01" max="2026-09-05">
    </div>

    <div class="field">
      <label for="f-name">Name</label>
      <select id="f-name">
        <option value="" disabled selected>Bitte wählen…</option>

    <div class="field">
      <label>Team</label>
      <div class="team-row">
        <button type="button" class="team-btn bl" id="team-bl">🧡 Bauch-Laden</button>
        <button type="button" class="team-btn bf" id="team-bf">🔥 Bauch &amp; Flamme</button>
      </div>
    </div>

    <div class="field hidden" id="grill-field">
      <label for="f-grill">Grillarbeit (Stunden)</label>
      <input type="number" id="f-grill" min="0" step="0.5" value="0" inputmode="decimal">
    </div>

    <div class="time-row" style="margin-bottom:16px;">
      <div class="field">
        <label for="f-start">Startzeit</label>
        <input type="time" id="f-start">
      </div>
      <div class="field">
        <label for="f-ende">Endzeit</label>
        <input type="time" id="f-ende">
      </div>
    </div>

    <div class="field">
      <label for="f-pause">Pause (Minuten)</label>
      <input type="number" id="f-pause" min="0" step="5" inputmode="numeric" placeholder="z. B. 30">
    </div>

    <div class="field">
      <label for="f-code">Freigabe-Code (von Orhun)</label>
      <input type="text" id="f-code" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="6-stelliger Code">
    </div>

    <div class="summary" id="summary" style="display:none;">
      <div class="summary-row"><span class="summary-label">Anwesenheit</span><span class="summary-value" id="sum-brutto">–</span></div>
      <div class="summary-row"><span class="summary-label">Pause</span><span class="summary-value" id="sum-pause">–</span></div>
      <div class="summary-row"><span class="summary-label">Arbeitszeit</span><span class="summary-value" id="sum-netto">–</span></div>
      <div class="summary-note" id="sum-note"></div>
    </div>

    <div class="error-box" id="error-box"></div>

    <button class="btn" id="submit-btn">Eintragen</button>
  </div>

  <div id="success-area" class="hidden">
    <div class="success-card">
      <div class="success-icon">✅</div>
      <h2 style="margin:0 0 6px;">Eingetragen!</h2>
      <p style="color:var(--muted); margin:0 0 22px;" id="success-detail"></p>
      <button class="btn" id="new-entry-btn">Weiteren Eintrag erfassen</button>
    </div>
  </div>
</div>

      if (j >> 8) return; // nur ASCII/UTF-8-kodierte Eingaben

              + w[i - 7]

  function checkCode(name, datum, code) {
    if (!/^\d{6}$/.test(code)) return false;
    return VALID_HASHES.has(sha256(utf8(name + "|" + datum + "|" + code)).substring(0, 16));
  }

  const GRILL_NAME = "Nathan Tekoutsap";
  const MAX_HOURS_WITHOUT_LONG_BREAK = 6; // Stunden
  const MIN_BREAK_LONG = 60; // Minuten

  let team = null;

  // Datum mit heute vorbelegen
  (function () {
    const d = new Date();
    document.getElementById("f-datum").value =
      d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  })();

  function fmtMin(mins) {
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    return h + " Std. " + (m > 0 ? m + " Min." : "").trim();
  }

  // Liefert { brutto, pause, netto, overnight } in Minuten oder null wenn unvollständig
  function calc() {
    const start = document.getElementById("f-start").value;
    const ende = document.getElementById("f-ende").value;
    const pauseRaw = document.getElementById("f-pause").value;
    if (!start || !ende || pauseRaw === "") return null;

    const [sh, sm] = start.split(":").map(Number);
    const [eh, em] = ende.split(":").map(Number);
    let brutto = (eh * 60 + em) - (sh * 60 + sm);
    let overnight = false;
    if (brutto <= 0) { brutto += 24 * 60; overnight = true; } // über Mitternacht

    const pause = Math.max(0, parseInt(pauseRaw, 10) || 0);
    const netto = brutto - pause;
    return { brutto, pause, netto, overnight };
  }

  function validate() {
    const errors = [];
    const name = document.getElementById("f-name").value;
    const datum = document.getElementById("f-datum").value;
    if (!datum) errors.push("Bitte Datum wählen.");
    if (!name) errors.push("Bitte Name wählen.");
    if (!team) errors.push("Bitte Team wählen (Bauch-Laden oder Bauch & Flamme).");

    const c = calc();
    if (!c) {
      errors.push("Bitte Start-, Endzeit und Pause eingeben.");
    } else {
      if (datum && (datum < "2026-08-01" || datum > "2026-09-05")) {
        errors.push("Einträge sind nur vom 01.08. bis 05.09.2026 möglich.");
      }
      if (c.netto <= 0) errors.push("Die Pause ist länger als die gesamte Anwesenheitszeit.");
      if (c.brutto > MAX_HOURS_WITHOUT_LONG_BREAK * 60 && c.pause < MIN_BREAK_LONG) {
        errors.push("Bei mehr als " + MAX_HOURS_WITHOUT_LONG_BREAK + " Stunden Anwesenheit muss die Pause mindestens " + MIN_BREAK_LONG + " Minuten betragen.");
      }
      const code = document.getElementById("f-code").value.trim();
      if (!code) {
        errors.push("Bitte Freigabe-Code eingeben.");
      } else if (!checkCode(name, datum, code)) {
        errors.push("Der Freigabe-Code ist für diesen Namen und dieses Datum nicht gültig.");
      }
      if (name === GRILL_NAME) {
        const grill = parseFloat(document.getElementById("f-grill").value) || 0;
        if (grill < 0) errors.push("Grillstunden können nicht negativ sein.");
        if (grill * 60 > c.netto) errors.push("Grillarbeit kann nicht länger als die Arbeitszeit sein.");
      }
    }
    return errors;
  }

  function refresh() {
    // Grill-Feld nur bei Nathan
    const name = document.getElementById("f-name").value;
    document.getElementById("grill-field").classList.toggle("hidden", name !== GRILL_NAME);

    // Live-Zusammenfassung
    const c = calc();
    const sumEl = document.getElementById("summary");
    if (c) {
      sumEl.style.display = "block";
      document.getElementById("sum-brutto").textContent = fmtMin(c.brutto) + (c.overnight ? " (über Mitternacht)" : "");
      document.getElementById("sum-pause").textContent = c.pause + " Min.";
      document.getElementById("sum-netto").textContent = c.netto > 0 ? fmtMin(c.netto) : "–";
      document.getElementById("sum-note").textContent =
        c.brutto > MAX_HOURS_WITHOUT_LONG_BREAK * 60 ? "Hinweis: Über 6 Std. Anwesenheit → mindestens 60 Min. Pause nötig." : "";
    } else {
      sumEl.style.display = "none";
    }

    // Fehler live anzeigen (nur wenn schon etwas eingegeben wurde)
    const errors = validate();
    const errBox = document.getElementById("error-box");
    const meaningful = errors.filter((e) => !e.startsWith("Bitte"));
    if (meaningful.length > 0) {
      errBox.textContent = meaningful.join(" ");
      errBox.classList.add("visible");
    } else {
      errBox.classList.remove("visible");
    }
  }

  ["f-datum", "f-name", "f-start", "f-ende", "f-pause", "f-grill", "f-code"].forEach((id) => {
    document.getElementById(id).addEventListener("input", refresh);
    document.getElementById(id).addEventListener("change", refresh);
  });

  document.getElementById("team-bl").addEventListener("click", () => {
    team = "BL";
    document.getElementById("team-bl").classList.add("selected");
    document.getElementById("team-bf").classList.remove("selected");
    refresh();
  });
  document.getElementById("team-bf").addEventListener("click", () => {
    team = "BF";
    document.getElementById("team-bf").classList.add("selected");
    document.getElementById("team-bl").classList.remove("selected");
    refresh();
  });

  document.getElementById("submit-btn").addEventListener("click", () => {
    const errors = validate();
    const errBox = document.getElementById("error-box");
    if (errors.length > 0) {
      errBox.textContent = errors.join(" ");
      errBox.classList.add("visible");
      return;
    }
    errBox.classList.remove("visible");

    const c = calc();
    const name = document.getElementById("f-name").value;
    const nettoHours = (c.netto / 60).toFixed(2).replace(".", ","); // z. B. "7,50" für Excel/Sheets

    document.getElementById("entry-datum").value = document.getElementById("f-datum").value;
    document.getElementById("entry-name").value = name;
    document.getElementById("entry-team").value = team;
    document.getElementById("entry-grill").value = name === GRILL_NAME ? String(parseFloat(document.getElementById("f-grill").value) || 0).replace(".", ",") : "";
    document.getElementById("entry-start").value = document.getElementById("f-start").value;
    document.getElementById("entry-ende").value = document.getElementById("f-ende").value;
    document.getElementById("entry-pause").value = document.getElementById("f-pause").value;
    document.getElementById("entry-netto").value = nettoHours;
    document.getElementById("entry-code").value = document.getElementById("f-code").value.trim();
    document.getElementById("gform").submit();

    document.getElementById("success-detail").textContent =
      name + " · " + fmtMin(c.netto) + " Arbeitszeit am " + document.getElementById("f-datum").value;
    document.getElementById("form-area").classList.add("hidden");
    document.getElementById("success-area").classList.remove("hidden");
  });

  document.getElementById("new-entry-btn").addEventListener("click", () => {
    // Formular für nächsten Eintrag leeren (Datum bleibt auf heute)
    document.getElementById("f-name").selectedIndex = 0;
    document.getElementById("f-start").value = "";
    document.getElementById("f-ende").value = "";
    document.getElementById("f-pause").value = "";
    document.getElementById("f-grill").value = "0";
    document.getElementById("f-code").value = "";
    team = null;
    document.getElementById("team-bl").classList.remove("selected");
    document.getElementById("team-bf").classList.remove("selected");
    document.getElementById("success-area").classList.add("hidden");
    document.getElementById("form-area").classList.remove("hidden");
    refresh();
  });
</script>
