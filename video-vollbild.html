<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Bauch &amp; Flamme – Speisekarte</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  video { width: 100vw; height: 100vh; object-fit: contain; display: block; }
  /* Hinweis, falls das Video nicht von selbst startet */
  #hinweis {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: #000; color: #fff; font-family: sans-serif; font-size: 4vh; text-align: center; cursor: pointer;
  }
</style>
</head>
<body>
  <video id="v" autoplay loop muted playsinline>
    <source src="video.mp4" type="video/mp4">
  </video>
  <div id="hinweis">Zum Starten tippen</div>
<script>
  const v = document.getElementById("v");
  const hinweis = document.getElementById("hinweis");

  // Falls der Browser die Wiedergabe blockiert: Hinweis einblenden
  v.play().catch(() => { hinweis.style.display = "flex"; });
  hinweis.addEventListener("click", () => {
    v.play();
    hinweis.style.display = "none";
  });

  // Sicherheitsnetz: sollte die Wiedergabe je stoppen, neu starten
  setInterval(() => {
    if (v.paused) v.play().catch(() => {});
  }, 5000);
</script>
</body>
</html>
