<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bauch & Flamme Bedienung Hilfe</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap">
<style>
  :root {
    --bg: #1F2A24;
    --panel: #28382F;
    --panel-border: rgba(245,241,230,0.12);
    --chalk: #F5F1E6;
    --chalk-muted: #B7BBA6;
    --mustard: #E8A33D;
    --brick: #B5573F;
    --sage: #7FA875;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); font-family: 'DM Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
  #app { max-width: 480px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; position: relative; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: rgba(245,241,230,0.15); border-radius: 3px; }

  .btn-tap { transition: transform 0.08s ease; }
  .btn-tap:active { transform: scale(0.90); }

  .row-enter { animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  .toast { animation: toastIn 0.25s ease; }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }

  .header { padding: 20px 20px 0 20px; flex-shrink: 0; }
  .header-top { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 8px; color: var(--chalk-muted); font-size: 13px; letter-spacing: 0.5px; text-transform: uppercase; }
  .link-btn { display: flex; align-items: center; gap: 6px; background: transparent; border: none; color: var(--chalk-muted); font-size: 13px; cursor: pointer; padding: 6px 8px; font-family: inherit; }

  .total-wrap { text-align: center; padding: 14px 0 10px 0; }
  .total-price { font-family: 'Caveat', cursive; font-weight: 700; font-size: 64px; line-height: 1; color: var(--chalk); }
  .total-price.active { color: var(--mustard); }
  .total-sub { color: var(--chalk-muted); font-size: 13px; margin-top: 4px; }

  .product-list { flex: 1; overflow-y: auto; padding: 8px 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-content: start; }
  .product-row { display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px; padding: 6px; }
  .round-btn { width: 30px; height: 30px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .btn-minus { background: var(--brick); color: var(--chalk); }
  .btn-minus:disabled { background: rgba(181,87,63,0.25); cursor: default; }
  .btn-plus { background: var(--mustard); color: #1F2A24; }
  .product-info { flex: 1; min-width: 0; }
  .product-name { color: var(--chalk); font-weight: 700; font-size: 12px; line-height: 1.2; }
  .product-meta { display: flex; align-items: center; gap: 6px; margin-top: 2px; flex-wrap: wrap; }
  .product-price { color: var(--chalk-muted); font-size: 11px; }
  .tally { display: flex; gap: 3px; flex-wrap: wrap; align-items: center; }
  .tally-zero { color: var(--chalk-muted); font-size: 11px; }
  .tally-num { color: var(--chalk); font-weight: 700; font-size: 13px; }

  .footer { padding: 10px 20px 22px 20px; flex-shrink: 0; }
  .primary-btn { width: 100%; padding: 16px 0; border-radius: 14px; border: none; background: var(--sage); color: #16241A; font-size: 17px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .primary-btn:disabled { background: rgba(127,168,117,0.3); color: rgba(31,42,36,0.6); cursor: default; }

  .toast-box { position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%); background: #0F1712; color: var(--chalk); padding: 8px 16px; border-radius: 999px; font-size: 13px; border: 1px solid var(--panel-border); white-space: nowrap; }

  .view-header { padding: 20px 20px 0 20px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; }
  .icon-btn { background: transparent; border: none; color: var(--chalk); cursor: pointer; padding: 4px; display: flex; }
  .view-title { color: var(--chalk); font-size: 18px; font-weight: 700; }

  .history-list { flex: 1; overflow-y: auto; padding: 16px 20px 24px 20px; }
  .empty-state { color: var(--chalk-muted); text-align: center; padding: 40px 0; line-height: 1.5; }
  .day-card { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
  .day-top { display: flex; justify-content: space-between; align-items: baseline; }
  .day-date { color: var(--chalk); font-weight: 700; font-size: 14px; }
  .day-revenue { color: var(--mustard); font-family: 'Caveat', cursive; font-weight: 700; font-size: 24px; }
  .day-sub { color: var(--chalk-muted); font-size: 12px; margin: 2px 0 8px 0; }
  .day-items { display: flex; flex-direction: column; gap: 4px; }
  .day-item-row { display: flex; justify-content: space-between; font-size: 13px; }
  .day-item-name { color: var(--chalk); }
  .day-item-qty { color: var(--chalk-muted); }

  .version-tag { color: var(--chalk-muted); font-size: 10px; opacity: 0.55; letter-spacing: 0.5px; margin-left: 4px; text-transform: none; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,18,0.75); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 20px; }
  .modal-box { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 16px; padding: 22px; width: 100%; max-width: 320px; }
  .modal-title { color: var(--chalk); font-weight: 700; font-size: 16px; margin-bottom: 12px; }
  .modal-input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--panel-border); background: var(--bg); color: var(--chalk); font-size: 18px; letter-spacing: 4px; text-align: center; font-family: inherit; outline: none; box-sizing: border-box; }
  .modal-input:focus { border-color: var(--mustard); }
  .modal-error { color: var(--brick); font-size: 13px; margin-top: 8px; min-height: 16px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 14px; }
  .modal-btn { flex: 1; padding: 12px 0; border-radius: 10px; border: none; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .modal-btn-cancel { background: transparent; border: 1px solid var(--panel-border); color: var(--chalk-muted); }
  .modal-btn-ok { background: var(--mustard); color: #1F2A24; }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="app">

  <!-- BESTELL-ANSICHT -->
  <div id="orderView">
    <div class="header">
      <div class="header-top">
        <div class="brand">🍽️ Bauch &amp; Flamme Bedienung Hilfe <span class="version-tag" id="versionTag"></span></div>
        <button class="link-btn btn-tap" id="openHistoryBtn">📋 Verlauf</button>
      </div>
      <div class="total-wrap">
        <div class="total-price" id="totalPrice">0,00&nbsp;€</div>
        <div class="total-sub" id="totalSub">Bereit für die nächste Bestellung</div>
      </div>

      <svg width="100%" height="10" viewBox="0 0 400 10" preserveAspectRatio="none">
        <path d="M0,5 Q20,0 40,5 T80,5 T120,5 T160,5 T200,5 T240,5 T280,5 T320,5 T360,5 T400,5" fill="none" stroke="rgba(245,241,230,0.12)" stroke-width="2"/>
      </svg>
    </div>

    <div class="product-list" id="productList"></div>

    <div class="footer">
      <button class="primary-btn btn-tap" id="nextCustomerBtn" disabled>Nächster Kunde</button>
    </div>
  </div>

  <div class="toast-box hidden" id="toast"></div>

  <!-- VERLAUF-ANSICHT -->
  <div id="historyView" class="hidden">
    <div class="view-header">
      <button class="icon-btn btn-tap" id="backBtn" aria-label="Zurück">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <span class="view-title" style="flex:1">Verlauf</span>
      <button class="link-btn btn-tap" id="clearHistoryBtn" style="color: var(--brick);">🗑️ Löschen</button>
    </div>
    <div class="history-list" id="historyList"></div>
  </div>

  <!-- PASSWORT-MODAL -->
  <div id="passwordModal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-title">Verlauf geschützt</div>
      <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" class="modal-input" id="passwordInput" placeholder="••••••" autocomplete="off">
      <div class="modal-error" id="passwordError"></div>
      <div class="modal-actions">
        <button class="modal-btn modal-btn-cancel btn-tap" id="passwordCancelBtn">Abbrechen</button>
        <button class="modal-btn modal-btn-ok btn-tap" id="passwordOkBtn">Bestätigen</button>
      </div>
    </div>
  </div>

</div>

<script>
  const PRODUCTS = [
    { id: "pommes", name: "Pommes", price: 4 },
    { id: "wedges", name: "Wedges", price: 5 },
    { id: "kinderhotdog", name: "Kinder Hotdog", price: 4 },
    { id: "rotewurst", name: "Rote Wurst", price: 5 },
    { id: "thueringer", name: "Thüringer Bratwurst", price: 7 },
    { id: "currywurst", name: "Currywurst", price: 7 },
    { id: "schweinenacken", name: "Schweinenackensteak", price: 8 },
    { id: "haehnchenbrust", name: "Hähnchenbrustfilet", price: 8 },
    { id: "feuerwurst", name: "Feuerwurst", price: 8 },
    { id: "weisswurstbrezel", name: "Weißwurst mit Brezel", price: 7 },
  ];

  const STORAGE_KEY = "bauchladen_history_v1";
  const SW_VERSION = "1.2.0";
  const HISTORY_PASSWORD = "111222";
  let order = {}; // { productId: qty } für den aktuellen Bon
  let toastTimer = null;

  function todayKey() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }

  function formatDateKey(key) {
    const [y, m, d] = key.split("-").map(Number);
    const date = new Date(y, m - 1, d);
    return date.toLocaleDateString("de-DE", { weekday: "long", day: "2-digit", month: "long", year: "numeric" });
  }

  function formatEUR(n) {
    return n.toLocaleString("de-DE", { style: "currency", currency: "EUR" });
  }

  function loadHistory() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      console.error("Verlauf konnte nicht gelesen werden", e);
      return {};
    }
  }

  function saveHistory(history) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
  }

  function tallyMarksSVG(count) {
    if (count === 0) return `<span class="tally-zero">—</span>`;
    if (count > 15) return `<span class="tally-num">${count}×</span>`;
    const groups = [];
    let remaining = count;
    while (remaining > 0) {
      groups.push(Math.min(remaining, 5));
      remaining -= 5;
    }
    let html = `<div class="tally">`;
    groups.forEach((g) => {
      const w = g === 5 ? 24 : Math.max(g * 6, 4);
      html += `<svg width="${w}" height="20" viewBox="0 0 ${w} 20">`;
      for (let j = 0; j < Math.min(g, 4); j++) {
        html += `<line x1="${3 + j * 6}" y1="2" x2="${3 + j * 6}" y2="18" stroke="#F5F1E6" stroke-width="2" stroke-linecap="round"/>`;
      }
      if (g === 5) {
        html += `<line x1="1" y1="18" x2="22" y2="1" stroke="#E8A33D" stroke-width="2" stroke-linecap="round"/>`;
      }
      html += `</svg>`;
    });
    html += `</div>`;
    return html;
  }

  function renderProductList() {
    const container = document.getElementById("productList");
    container.innerHTML = PRODUCTS.map((p) => {
      const qty = order[p.id] || 0;
      return `
        <div class="product-row row-enter">
          <button class="round-btn btn-minus btn-tap" data-action="minus" data-id="${p.id}" ${qty === 0 ? "disabled" : ""} aria-label="${p.name} entfernen">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14"/></svg>
          </button>
          <div class="product-info">
            <div class="product-name">${p.name}</div>
            <div class="product-meta">
              <span class="product-price">${formatEUR(p.price)}</span>
              ${tallyMarksSVG(qty)}
            </div>
          </div>
          <button class="round-btn btn-plus btn-tap" data-action="plus" data-id="${p.id}" aria-label="${p.name} hinzufügen">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>`;
    }).join("");

    container.querySelectorAll("[data-action]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const id = btn.getAttribute("data-id");
        const action = btn.getAttribute("data-action");
        if (action === "plus") order[id] = (order[id] || 0) + 1;
        else order[id] = Math.max(0, (order[id] || 0) - 1);
        renderOrder();
      });
    });
  }

  function renderOrder() {
    const totalItems = Object.values(order).reduce((a, b) => a + b, 0);
    const totalPrice = PRODUCTS.reduce((sum, p) => sum + (order[p.id] || 0) * p.price, 0);

    const totalPriceEl = document.getElementById("totalPrice");
    totalPriceEl.textContent = formatEUR(totalPrice);
    totalPriceEl.classList.toggle("active", totalItems > 0);

    document.getElementById("totalSub").textContent =
      totalItems === 0 ? "Bereit für die nächste Bestellung" : `${totalItems} Artikel`;

    document.getElementById("nextCustomerBtn").disabled = totalItems === 0;

    renderProductList();
  }

  function showToast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.remove("hidden");
    el.classList.add("toast");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.add("hidden"), 2200);
  }

  function nextCustomer() {
    const totalItems = Object.values(order).reduce((a, b) => a + b, 0);
    if (totalItems === 0) return;
    const totalPrice = PRODUCTS.reduce((sum, p) => sum + (order[p.id] || 0) * p.price, 0);

    const history = loadHistory();
    const dateKey = todayKey();
    const existing = history[dateKey] || { products: {}, revenue: 0, transactions: 0 };
    Object.entries(order).forEach(([id, qty]) => {
      if (qty > 0) existing.products[id] = (existing.products[id] || 0) + qty;
    });
    existing.revenue += totalPrice;
    existing.transactions += 1;
    history[dateKey] = existing;
    saveHistory(history);

    order = {};
    renderOrder();
    showToast("Bon gespeichert ✓");
  }

  function renderHistory() {
    const history = loadHistory();
    const days = Object.keys(history)
      .sort((a, b) => (a < b ? 1 : -1))
      .map((k) => ({ dateKey: k, ...history[k] }));

    const container = document.getElementById("historyList");

    if (days.length === 0) {
      container.innerHTML = `<div class="empty-state">Noch keine Verkäufe erfasst. Sobald der erste Bon abgeschlossen ist, taucht er hier auf.</div>`;
      return;
    }

    container.innerHTML = days.map((day) => {
      const itemsHtml = PRODUCTS.filter((p) => (day.products || {})[p.id])
        .map((p) => `<div class="day-item-row"><span class="day-item-name">${p.name}</span><span class="day-item-qty">${day.products[p.id]}×</span></div>`)
        .join("");
      return `
        <div class="day-card">
          <div class="day-top">
            <div class="day-date">${formatDateKey(day.dateKey)}</div>
            <div class="day-revenue">${formatEUR(day.revenue || 0)}</div>
          </div>
          <div class="day-sub">${day.transactions || 0} ${day.transactions === 1 ? "Bon" : "Bons"}</div>
          <div class="day-items">${itemsHtml}</div>
        </div>`;
    }).join("");
  }

  function openHistory() {
    document.getElementById("orderView").classList.add("hidden");
    document.getElementById("historyView").classList.remove("hidden");
    renderHistory();
  }

  function showPasswordModal() {
    const modal = document.getElementById("passwordModal");
    const input = document.getElementById("passwordInput");
    document.getElementById("passwordError").textContent = "";
    input.value = "";
    modal.classList.remove("hidden");
    setTimeout(() => input.focus(), 50);
  }

  function hidePasswordModal() {
    document.getElementById("passwordModal").classList.add("hidden");
  }

  function checkPassword() {
    const input = document.getElementById("passwordInput");
    if (input.value === HISTORY_PASSWORD) {
      hidePasswordModal();
      openHistory();
    } else {
      document.getElementById("passwordError").textContent = "Falsches Passwort";
      input.value = "";
      input.focus();
    }
  }

  document.getElementById("openHistoryBtn").addEventListener("click", showPasswordModal);
  document.getElementById("passwordCancelBtn").addEventListener("click", hidePasswordModal);
  document.getElementById("passwordOkBtn").addEventListener("click", checkPassword);
  document.getElementById("passwordInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") checkPassword();
  });

  document.getElementById("backBtn").addEventListener("click", () => {
    document.getElementById("historyView").classList.add("hidden");
    document.getElementById("orderView").classList.remove("hidden");
  });

  document.getElementById("nextCustomerBtn").addEventListener("click", nextCustomer);

  document.getElementById("clearHistoryBtn").addEventListener("click", () => {
    const confirmed = window.confirm("Gesamten Verlauf wirklich unwiderruflich löschen?");
    if (confirmed) {
      localStorage.removeItem(STORAGE_KEY);
      renderHistory();
      showToast("Verlauf gelöscht");
    }
  });

  document.getElementById("versionTag").textContent = `v${SW_VERSION}`;

  renderOrder();
</script>
</body>
</html>
